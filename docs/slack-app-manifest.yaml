# Slack app manifest for claude-zeta (zeta spike).
# Workspace cible: robotique-yhom.
# Usage: api.slack.com/apps → Create New App → From an app manifest → paste this YAML.
# Après Create: générer le xapp-token (Socket Mode) et installer pour récupérer le xoxb-token.

display_information:
  name: claude-zeta
  description: Claude Code agent (zeta spike) — Slack channel via claude --channels plugin
  background_color: "#1a1a1a"

features:
  bot_user:
    display_name: claude-zeta
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:read
      - im:write
      - reactions:write
      # Optional — enables native "is thinking..." status (issue #3).
      # Requires app type "Agents & AI Apps" in Dev Portal > AI Features.
      - assistant:write

settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
